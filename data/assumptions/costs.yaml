# Every cost between buying the cargo and selling it, other than freight.
# Also the crude grades and the pricing conventions.

pricing:
  origin_differential_usd_per_bbl:
    value: 1.00
    unit: USD per barrel
    source: Our estimate
    checked: 2026-11-15
    estimate: true
    note: >
      The free WTI price is for oil at Cushing, Oklahoma, an inland pipeline hub. Oil loaded on a
      ship at the Gulf Coast normally costs a little more, roughly the pipeline tariff to the
      coast. Real Gulf Coast export prices (WTI at Houston, "MEH") are paywalled. This is the
      differential for the "WTI" grade; WTI Midland and Mars carry their own, under grades.
  destination_differential_usd_per_bbl:
    value: 0.00
    unit: USD per barrel
    source: Our estimate
    checked: 2026-11-15
    estimate: true
    note: >
      A premium or discount to the benchmark that a buyer in India pays on delivery. Real delivered
      premiums are negotiated cargo by cargo and are paywalled, so the default is zero and the
      user can change it.

financing:
  benchmark_rate_pct:
    value: 3.90
    unit: percent per year
    source: Federal Reserve Bank of New York, Secured Overnight Financing Rate (SOFR), 12 November 2026
    url: https://www.newyorkfed.org/markets/reference-rates/sofr
    checked: 2026-11-15
    estimate: false
  margin_pct:
    value: 2.00
    unit: percent per year
    source: Our estimate
    checked: 2026-11-15
    estimate: true
    note: >
      What a bank adds on top of the benchmark to lend against a cargo. Depends on the trader's
      credit; one to three percentage points is a commonly quoted range.
  day_count:
    value: 360
    unit: days per year
    source: Market convention for US dollar money-market interest
    checked: 2026-11-15
    estimate: false
  extra_days:
    value: 0
    unit: days
    source: Our assumption
    checked: 2026-11-15
    estimate: true
    note: >
      Crude is usually paid for 30 days after loading, and the buyer pays 30 days after delivery,
      so the two delays cancel and the money is tied up for about the length of the laden voyage.
      Raise this number if the buyer gets longer credit than the seller gives.

insurance:
  cargo_rate_pct:
    value: 0.05
    unit: percent of insured value
    source: Our estimate
    checked: 2026-11-15
    estimate: true
    note: >
      Cargo insurance for bulk oil on a major route is cheap; a few hundredths of a percent is
      typical. We found no free published rate.
  insured_value_uplift_pct:
    value: 110
    unit: percent of cargo value plus freight
    source: Standard practice is to insure invoice value plus freight plus 10%
    url: https://www.handybulk.com/marine-cargo-insurance-and-institute-cargo-clauses-coverage-exclusions-transit-claims-and-commodity-forms/
    checked: 2026-11-15
    estimate: false
  red_sea_war_risk_pct_of_hull:
    value: 0.5
    unit: percent of ship value per transit
    source: Our estimate
    checked: 2026-11-15
    estimate: true
    note: >
      Extra premium insurers charge on the ship itself for passing the southern Red Sea, where
      commercial ships have been attacked since late 2023. Press reports during 2024 quoted 0.5% to
      1% of hull value per transit. Charged once per Red Sea passage on the Suez route; zero via the Cape.

transit_loss:
  loss_pct:
    value: 0.2
    unit: percent of volume
    source: Our estimate
    checked: 2026-11-15
    estimate: true
    note: >
      Slightly less oil is measured out at discharge than was measured in at loading (evaporation,
      oil clinging to tanks, measurement differences). Contracts often tolerate up to about 0.5%;
      0.1-0.3% is a common rule of thumb.

demurrage:
  default_delay_days:
    value: 0
    unit: days
    source: Our assumption
    checked: 2026-11-15
    estimate: true
    note: The base case assumes no delay. The Scenarios page lets the user add delay days.
  rate_as_share_of_hire:
    value: 1.0
    unit: multiple of the daily hire rate
    source: Our assumption
    checked: 2026-11-15
    estimate: true
    note: >
      Demurrage is the daily penalty paid to the shipowner when the ship is held up beyond the
      agreed time. It is negotiated per charter but tracks what the ship could earn elsewhere, so
      we set it equal to the daily hire rate, plus fuel burned while waiting.

voyage_basis:
  charge_ballast_leg:
    value: true
    source: Tanker freight convention (Worldscale rates assume a round voyage)
    url: https://www.worldscale.co.uk/
    checked: 2026-11-15
    estimate: false
    note: >
      The cargo pays for the ship's empty trip back as well as the loaded trip out, because the
      owner earns nothing on the way back. This is how tanker freight is normally priced.

quality:
  # Simple, transparent rule for how much more or less a grade is worth than
  # the benchmark it is priced against.
  usd_per_api_degree:
    value: 0.40
    unit: USD per barrel, per degree of API gravity
    source: Our estimate, in line with gravity escalators in producer price formulas (for example Iraq's Basrah grades)
    checked: 2026-11-15
    estimate: true
    note: >
      Lighter crude (higher API) yields more petrol and diesel, so it is normally worth more.
      A straight line is a simplification: refiners value crude by the products it actually yields.
  usd_per_sulphur_pct:
    value: 1.00
    unit: USD per barrel, per percentage point of sulphur
    source: Our estimate
    checked: 2026-11-15
    estimate: true
    note: >
      Sulphur must be removed in refining, so higher-sulphur ("sour") crude is worth less. The
      sweet-sour gap moves a lot with the market; this is a mid-range figure.

grades:
  wti:
    name: {value: "WTI (US light sweet)"}
    shipped: {value: true}
    api_gravity:
      value: 39.6
      unit: degrees API
      source: US EIA, Today in Energy, 16 July 2012, "Crude oils have different quality characteristics"
      url: https://www.eia.gov/todayinenergy/detail.php?id=7110
      checked: 2026-11-15
      estimate: false
    sulphur_pct:
      value: 0.24
      unit: percent by weight
      source: US EIA, Today in Energy, 16 July 2012, "Crude oils have different quality characteristics"
      url: https://www.eia.gov/todayinenergy/detail.php?id=7110
      checked: 2026-11-15
      estimate: false
  brent:
    name: {value: "Brent (North Sea light sweet)"}
    api_gravity:
      value: 38.3
      unit: degrees API
      source: US EIA, Today in Energy, 16 July 2012, "Crude oils have different quality characteristics"
      url: https://www.eia.gov/todayinenergy/detail.php?id=7110
      checked: 2026-11-15
      estimate: false
    sulphur_pct:
      value: 0.37
      unit: percent by weight
      source: US EIA, Today in Energy, 16 July 2012, "Crude oils have different quality characteristics"
      url: https://www.eia.gov/todayinenergy/detail.php?id=7110
      checked: 2026-11-15
      estimate: false
  wti_midland:
    name: {value: "WTI Midland (US export grade)"}
    shipped: {value: true}
    api_gravity:
      value: 42.0
      unit: degrees API
      source: "S&P Global Platts WTI Midland specification: 40 to 44 API gravity"
      url: https://www.spglobal.com/platts/en/our-methodology/subscriber-notes/080620-platts-implements-comprehensive-platts-wti-midland-specifications
      checked: 2026-11-17
      estimate: true
      note: >
        The middle of the published 40-44 range; each cargo's real gravity differs.
    sulphur_pct:
      value: 0.20
      unit: percent by weight
      source: "S&P Global Platts WTI Midland specification: 0.2% sulphur or less"
      url: https://www.spglobal.com/platts/en/our-methodology/subscriber-notes/080620-platts-implements-comprehensive-platts-wti-midland-specifications
      checked: 2026-11-17
      estimate: true
      note: >
        The specification's maximum, so real cargoes are usually a little sweeter.
    export_differential_usd_per_bbl:
      value: 1.30
      unit: USD per barrel over WTI at Cushing
      source: "Argus, 10 March 2026: Permian-quality WTI at Houston (MEH) at a $1.25-1.35/bl premium to the Cushing benchmark"
      url: https://www.argusmedia.com/en/news-and-insights/latest-market-news/2796268-us-gulf-crude-premiums-near-6-year-high-on-iran-war
      checked: 2026-11-17
      estimate: true
      note: >
        A dated snapshot of a price that moves daily: Platts put the Houston premium at $5.20 nine
        days later, during the Iran war. Change it in the sidebar to test other levels.
  mars:
    name: {value: "Mars (US Gulf medium sour)"}
    shipped: {value: true}
    api_gravity:
      value: 29.5
      unit: degrees API
      source: "S&P Global, January 2018: Mars assay of November 2017 at 29.5 API and 1.89% sulphur"
      url: https://www.spglobal.com/energy/en/news-research/blog/crude-oil/012318-usgc-blended-crude-loop-sour-gets-second-full-assay-treatment-in-the-loop
      checked: 2026-11-17
      estimate: false
      note: >
        Mars is a blend of offshore Gulf of Mexico fields, loaded mainly at LOOP; its quality drifts
        (a 2012 assay gave 28.8 API and 1.8% sulphur).
    sulphur_pct:
      value: 1.89
      unit: percent by weight
      source: "S&P Global, January 2018: Mars assay of November 2017 at 29.5 API and 1.89% sulphur"
      url: https://www.spglobal.com/energy/en/news-research/blog/crude-oil/012318-usgc-blended-crude-loop-sour-gets-second-full-assay-treatment-in-the-loop
      checked: 2026-11-17
      estimate: false
    export_differential_usd_per_bbl:
      value: 1.50
      unit: USD per barrel over WTI at Cushing
      source: "Market report, late May 2026: the Mars premium to WTI fell back to about $1.50 after peaking near $18 in early April"
      url: https://www.argusmedia.com/en/news-and-insights/latest-market-news/2799214-mars-crude-premium-swings-down-by-10-bl
      checked: 2026-11-17
      estimate: true
      note: >
        Sour crude normally trades below WTI, but with Middle East sour supply disrupted in 2026 Mars
        swung to large premiums (Argus reported nearly $13 on 9 March). The $1.50 figure is from a
        secondary report and is a dated snapshot; change it in the sidebar.
  dubai:
    name: {value: "Dubai (Middle East medium sour)"}
    api_gravity:
      value: 31.0
      unit: degrees API
      source: US EIA, Today in Energy, 16 July 2012, "Crude oils have different quality characteristics"
      url: https://www.eia.gov/todayinenergy/detail.php?id=7110
      checked: 2026-11-15
      estimate: false
    sulphur_pct:
      value: 2.0
      unit: percent by weight
      source: US EIA, Today in Energy, 16 July 2012, "Crude oils have different quality characteristics"
      url: https://www.eia.gov/todayinenergy/detail.php?id=7110
      checked: 2026-11-15
      estimate: false

scenario_ranges:
  # How far the tornado chart flexes each input, up and down.
  hire_rate_pct: {value: 25, unit: percent, source: Our choice, checked: 2026-11-15, estimate: true}
  bunker_price_pct: {value: 25, unit: percent, source: Our choice, checked: 2026-11-15, estimate: true}
  interest_rate_points: {value: 2.0, unit: percentage points, source: Our choice, checked: 2026-11-15, estimate: true}
  price_spread_usd: {value: 2.0, unit: USD per barrel, source: Our choice, checked: 2026-11-15, estimate: true}
  delay_days: {value: 5, unit: days, source: Our choice, checked: 2026-11-15, estimate: true}
  transit_loss_points: {value: 0.2, unit: percentage points, source: Our choice, checked: 2026-11-15, estimate: true}
  # The freight-versus-spread grid on the Scenarios page: the range each axis covers.
  grid_hire_min_usd_per_day: {value: 10000, unit: USD per day, source: Our choice, checked: 2026-11-17, estimate: true}
  grid_hire_max_usd_per_day: {value: 500000, unit: USD per day, source: Our choice, checked: 2026-11-17, estimate: true}
  grid_spread_min_usd: {value: -5, unit: USD per barrel, source: Our choice, checked: 2026-11-17, estimate: true}
  grid_spread_max_usd: {value: 40, unit: USD per barrel, source: Our choice, checked: 2026-11-17, estimate: true}
  grid_steps: {value: 16, unit: points per axis, source: Our choice, checked: 2026-11-17, estimate: true}

commissions:
  # Deducted from the freight in a voyage charter. They change what a broker's
  # quote costs the charterer and what the owner keeps; they are not an extra cost.
  address_commission_pct:
    value: 2.5
    unit: percent of freight
    source: "Handybulk shipbroking guide: address commission is usually deducted from freight and returned to the charterer; 2.5% with 1.25% brokerage (3.75% in total) is a common combination"
    url: https://www.handybulk.com/shipbrokers-commissions-and-brokerage-in-chartering/
    checked: 2026-11-17
    estimate: true
    note: >
      There is no fixed market rate (1.25% to 2.5% is common for tankers) and the source is a
      broker's guide, not an official one, so this is an estimate. Used only when a broker's
      quote is typed in: the charterer's net freight is the quote less this commission.
  brokerage_pct:
    value: 1.25
    unit: percent of freight
    source: "Handybulk shipbroking guide: tanker brokerage is commonly 1.25%, paid by the owner out of freight"
    url: https://www.handybulk.com/shipbrokers-commission-brokerage-address-commission-and-sp-fees-explained/
    checked: 2026-11-17
    estimate: true
    note: >
      Paid by the shipowner to the brokers, so it lowers the owner's daily earnings (TCE) but does
      not change what the charterer pays.

lightering:
  usd_per_bbl:
    value: 0.60
    unit: USD per barrel of cargo
    source: "Columbia University Center on Global Energy Policy (2018): lightering adds an estimated 50 to 75 cents a barrel to the cost of transport from the US Gulf Coast"
    url: https://www.energypolicy.columbia.edu/sites/default/files/pictures/GulfofMexCongestionRisk_CGEP_commentary.pdf
    checked: 2026-11-17
    estimate: true
    note: >
      Mid-point of the published 50-75 cent range, which dates from 2018 and was worked out for
      VLCCs. Charged on the whole cargo whenever the ship is too deep to leave the load port fully
      loaded (see the draught warning). Today's much higher freight rates would make the hire of
      the small top-up ships dearer, so this is probably low in the current market.

eu_ets:
  # The EU Emissions Trading System: ships pay for the CO2 they emit on voyages to and from EU ports.
  co2_per_tonne_fuel:
    value: 3.114
    unit: tonnes of CO2 per tonne of fuel oil
    source: "EU MRV Regulation (EU) 2015/757 default factor for heavy fuel oil; the IMO uses 3.114 for fuel oil with 0.10-0.50% sulphur"
    url: https://www.zerocarbonshipping.com/files/countdown-nzf-3_lca-guidelines_figures.pdf
    checked: 2026-11-17
    estimate: false
  coverage_pct:
    value: 100
    unit: percent of emissions
    source: "EU ETS maritime phase-in: 40% of 2024 emissions, 70% of 2025, 100% from 2026"
    url: https://www.zeronorth.com/blog/regulations-what-is-the-eu-ets
    checked: 2026-11-17
    estimate: false
  share_of_voyage_outside_eu_pct:
    value: 50
    unit: percent of emissions
    source: "EU ETS maritime: half of the emissions of a voyage that starts or ends outside the EU are covered; all emissions at berth in an EU port are covered"
    url: https://www.zeronorth.com/blog/regulations-what-is-the-eu-ets
    checked: 2026-11-17
    estimate: false
  eua_price_eur_per_tonne:
    value: 75
    unit: EUR per tonne of CO2
    source: "Market reports, May 2026: EU carbon allowances trading in the EUR 74-77 a tonne range"
    url: https://kpioceanconnect.com/euas-september-is-the-deadline-but-strategy-is-the-bigger-story/
    checked: 2026-11-17
    estimate: true
    note: >
      The allowance price moves every day and no free live feed was found, so this is a dated
      snapshot. Methane and nitrous oxide, added to the scheme in 2026, are not counted.
  usd_per_eur:
    value: 1.10
    unit: USD per EUR
    source: Our estimate
    checked: 2026-11-17
    estimate: true
    note: >
      Round figure for converting the allowance price into dollars; the exchange rate moves daily
      and was not checked against a live source.

futures_curve:
  default_m2_minus_m1_usd_per_bbl:
    value: 0.0
    unit: USD per barrel per month
    source: Our choice
    checked: 2026-11-17
    estimate: true
    note: >
      The US EIA stopped publishing NYMEX WTI futures prices in April 2024 and no other free source
      was found, so the tool does not know today's curve. It starts at zero (a flat curve, no effect)
      and you type the gap between the second and first futures months. The EIA history from 1985 to
      April 2024 is shown on the Arbitrage page for scale.
  history_source:
    value: "EIA series RCLC1 and RCLC2 (NYMEX WTI futures contracts 1 and 2), monthly average of the daily gap, January 1985 to April 2024"
    source: "US EIA, Cushing OK Crude Oil Future Contracts 1 and 2 (Dollars per Barrel)"
    url: https://www.eia.gov/dnav/pet/pet_pri_fut_s1_d.htm
    checked: 2026-11-17
    estimate: false

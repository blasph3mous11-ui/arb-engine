# Ports, canal tolls and reference distances.
# Port costs are quoted for a Suezmax; other ship sizes scale by the
# port_cost_factor in vessels.yaml.

ports:
  corpus_christi:
    name: {value: "Corpus Christi, USA"}
    role: {value: origin}
    region: {value: us_gulf}
    channel_depth_ft:
      value: 54
      unit: feet
      source: "Port of Corpus Christi: Channel Improvement Project completed June 2025, deepening the channel from 47 to 54 feet"
      url: https://portofcc.com/news/port-of-corpus-christi-completes-milestone-ship-channel-improvement-project/
      checked: 2026-11-17
      estimate: false
    latitude: {value: 27.81, unit: degrees north, source: Port location, checked: 2026-11-15, estimate: false}
    longitude: {value: -97.10, unit: degrees east, source: Port location (Gulf entrance at Port Aransas), checked: 2026-11-15, estimate: false}
    port_cost_usd:
      value: 78000
      unit: USD per call (Suezmax)
      source: As reported in a search-engine extract (not yet confirmed against the document) of S&P Global Platts, Specifications Guide Global Freight (September 2026), Suezmax port cost Corpus Christi
      url: https://www.spglobal.com/content/dam/spglobal/ci/en/documents/platts/en/our-methodology/methodology-specifications/shipping/freight-specifications.pdf
      checked: 2026-11-15
      estimate: true
      note: >
        Read from a search-engine extract because the document blocks automated download. Flagged as
        an estimate until the figure has been confirmed by eye against the document itself. A
        modelling input Platts uses in its own freight calculations, not an invoice.
  houston:
    name: {value: "Houston, USA"}
    role: {value: origin}
    region: {value: us_gulf}
    channel_depth_ft:
      value: 45
      unit: feet
      source: Our estimate
      checked: 2026-11-17
      estimate: true
      note: >
        The Houston Ship Channel is commonly given as about 45 ft; a deepening project (Project 11) has been under way since 2022. Not confirmed against a USACE survey.
    latitude: {value: 29.34, unit: degrees north, source: Port location (Galveston Bay entrance), checked: 2026-11-15, estimate: false}
    longitude: {value: -94.70, unit: degrees east, source: Port location (Galveston Bay entrance), checked: 2026-11-15, estimate: false}
    port_cost_usd:
      value: 90000
      unit: USD per call (Suezmax)
      source: Our estimate
      checked: 2026-11-15
      estimate: true
      note: >
        No free published figure found. Set a little above Corpus Christi ($78,000, a Platts figure)
        because the Houston Ship Channel is a longer pilotage and tug job.
  sikka:
    name: {value: "Sikka (Jamnagar), India"}
    role: {value: destination}
    region: {value: india}
    latitude: {value: 22.45, unit: degrees north, source: Port location, checked: 2026-11-15, estimate: false}
    longitude: {value: 69.60, unit: degrees east, source: Port location (Gulf of Kutch approach), checked: 2026-11-15, estimate: false}
    port_cost_usd:
      value: 150000
      unit: USD per call (Suezmax)
      source: Our estimate
      checked: 2026-11-15
      estimate: true
      note: >
        No free published figure found. Indian port and light dues are generally higher than US
        Gulf ones, so we use roughly double the Corpus Christi figure. At under $0.20 a barrel either
        way, this is not a number that changes the answer.
  mumbai:
    name: {value: "Mumbai, India"}
    role: {value: destination}
    region: {value: india}
    latitude: {value: 18.90, unit: degrees north, source: Port location, checked: 2026-11-15, estimate: false}
    longitude: {value: 72.75, unit: degrees east, source: Port location (harbour approach), checked: 2026-11-15, estimate: false}
    port_cost_usd:
      value: 150000
      unit: USD per call (Suezmax)
      source: Our estimate
      checked: 2026-11-15
      estimate: true
      note: Same reasoning as Sikka.

  loop:
    name: {value: "LOOP (Louisiana Offshore Oil Port), USA"}
    role: {value: origin}
    region: {value: us_gulf}
    channel_depth_ft:
      value: 85
      unit: feet
      source: Our estimate
      url: https://www.eia.gov/todayinenergy/detail.php?id=36232
      checked: 2026-11-17
      estimate: true
      note: >
        An offshore buoy terminal in deep water. The US EIA says it is the only US facility able to fully load a VLCC; the exact water depth was not checked, so the figure is set comfortably above any ship in this tool.
    latitude: {value: 28.88, unit: degrees north, source: Port location (offshore terminal, 18 miles off Louisiana), checked: 2026-11-17, estimate: false}
    longitude: {value: -90.03, unit: degrees east, source: Port location (offshore terminal, 18 miles off Louisiana), checked: 2026-11-17, estimate: false}
    port_cost_usd:
      value: 60000
      unit: USD per call (Suezmax)
      source: Our estimate
      checked: 2026-11-17
      estimate: true
      note: >
        No free published figure found. An offshore mooring needs no channel pilotage or harbour tugs,
        so we set it below Corpus Christi ($78,000, Platts). LOOP is the one US terminal that can fully
        load a VLCC (US EIA, https://www.eia.gov/todayinenergy/detail.php?id=36232), so it is the natural
        load port when the ship is a VLCC.
  beaumont:
    name: {value: "Beaumont / Nederland, USA"}
    role: {value: origin}
    region: {value: us_gulf}
    channel_depth_ft:
      value: 40
      unit: feet
      source: "Marine Log: state loan approved to begin deepening the Sabine-Neches Waterway from its current 40-foot depth"
      url: https://www.marinelog.com/inland-coastal/historic-funding-approved-for-texas-ship-channels/
      checked: 2026-11-17
      estimate: false
    latitude: {value: 29.6, unit: degrees north, source: Port location (Sabine Pass entrance), checked: 2026-11-17, estimate: false}
    longitude: {value: -93.83, unit: degrees east, source: Port location (Sabine Pass entrance), checked: 2026-11-17, estimate: false}
    port_cost_usd:
      value: 90000
      unit: USD per call (Suezmax)
      source: Our estimate
      checked: 2026-11-17
      estimate: true
      note: >
        No free published figure found. Like Houston, a long river and channel transit, so we use the
        same figure as our Houston estimate.
  paradip:
    name: {value: "Paradip, India (east coast)"}
    role: {value: destination}
    region: {value: india}
    latitude: {value: 20.2, unit: degrees north, source: Port location (port approach), checked: 2026-11-17, estimate: false}
    longitude: {value: 86.75, unit: degrees east, source: Port location (port approach), checked: 2026-11-17, estimate: false}
    port_cost_usd:
      value: 150000
      unit: USD per call (Suezmax)
      source: Our estimate
      checked: 2026-11-17
      estimate: true
      note: >
        No free published figure found. Same reasoning as Sikka.
  rotterdam:
    name: {value: "Rotterdam, Netherlands"}
    role: {value: destination}
    region: {value: europe}
    latitude: {value: 52.0, unit: degrees north, source: Port location (Maasvlakte entrance), checked: 2026-11-17, estimate: false}
    longitude: {value: 3.9, unit: degrees east, source: Port location (Maasvlakte entrance), checked: 2026-11-17, estimate: false}
    port_cost_usd:
      value: 130000
      unit: USD per call (Suezmax)
      source: Our estimate
      checked: 2026-11-17
      estimate: true
      note: >
        No free published figure found. Rotterdam's harbour dues are charged on ship size and cargo and
        are known to be high for a large tanker; we place it between the US Gulf and Indian figures.
  singapore:
    name: {value: "Singapore"}
    role: {value: destination}
    region: {value: east_asia}
    latitude: {value: 1.2, unit: degrees north, source: Port location (western anchorage), checked: 2026-11-17, estimate: false}
    longitude: {value: 103.75, unit: degrees east, source: Port location (western anchorage), checked: 2026-11-17, estimate: false}
    port_cost_usd:
      value: 100000
      unit: USD per call (Suezmax)
      source: Our estimate
      checked: 2026-11-17
      estimate: true
      note: >
        No free published figure found. A competitive hub port; set a little above the US Gulf figures.
  ningbo:
    name: {value: "Ningbo-Zhoushan, China"}
    role: {value: destination}
    region: {value: east_asia}
    latitude: {value: 29.9, unit: degrees north, source: Port location (port approach), checked: 2026-11-17, estimate: false}
    longitude: {value: 122.3, unit: degrees east, source: Port location (port approach), checked: 2026-11-17, estimate: false}
    port_cost_usd:
      value: 140000
      unit: USD per call (Suezmax)
      source: Our estimate
      checked: 2026-11-17
      estimate: true
      note: >
        No free published figure found. Chinese port and tonnage dues for a large tanker are comparable
        to other major Asian discharge ports; set close to our Indian estimate.
  ulsan:
    name: {value: "Ulsan, South Korea"}
    role: {value: destination}
    region: {value: east_asia}
    latitude: {value: 35.45, unit: degrees north, source: Port location (port approach), checked: 2026-11-17, estimate: false}
    longitude: {value: 129.45, unit: degrees east, source: Port location (port approach), checked: 2026-11-17, estimate: false}
    port_cost_usd:
      value: 120000
      unit: USD per call (Suezmax)
      source: Our estimate
      checked: 2026-11-17
      estimate: true
      note: >
        No free published figure found. Set between the Singapore and Ningbo estimates.

port_time:
  load_days:
    value: 2.0
    unit: days
    source: Our estimate
    checked: 2026-11-15
    estimate: true
    note: >
      Crude charters typically allow 72 hours in total for loading and discharging. We allow two
      days at each end to include berthing, paperwork and waiting for a tide or a pilot.
  discharge_days:
    value: 2.0
    unit: days
    source: Our estimate
    checked: 2026-11-15
    estimate: true
    note: Same reasoning as load days.

suez_canal:
  # Tolls are charged per Suez Canal Net Ton (SCNT) on a sliding scale, in
  # SDR (the IMF's currency basket), then converted to dollars.
  band_sizes_scnt:
    value: [5000, 5000, 10000, 20000, 30000, 50000]
    unit: SCNT per band (anything above the last band is "the rest")
    source: Suez Canal Authority, Transit Dues Rates applicable from 15 January 2024 (Circular 7/2023)
    url: https://www.kanooshipping.com/storage/uploads/circulars/1697703461_SUEZ CANAL - REVISED TOLL FEE - Circular 7 2023 - 1.pdf
    checked: 2026-11-15
    estimate: false
  laden_rates_sdr_per_scnt:
    value: [11.04, 7.82, 5.91, 2.93, 2.53, 2.17, 2.13]
    unit: SDR per SCNT, crude oil tankers, laden
    source: Suez Canal Authority, Transit Dues Rates applicable from 15 January 2024 (Circular 7/2023)
    url: https://www.kanooshipping.com/storage/uploads/circulars/1697703461_SUEZ CANAL - REVISED TOLL FEE - Circular 7 2023 - 1.pdf
    checked: 2026-11-15
    estimate: false
  ballast_rates_sdr_per_scnt:
    value: [9.40, 6.64, 5.04, 2.50, 2.14, 1.85, 1.82]
    unit: SDR per SCNT, crude oil tankers, in ballast
    source: Suez Canal Authority, Transit Dues Rates applicable from 15 January 2024 (Circular 7/2023)
    url: https://www.kanooshipping.com/storage/uploads/circulars/1697703461_SUEZ CANAL - REVISED TOLL FEE - Circular 7 2023 - 1.pdf
    checked: 2026-11-15
    estimate: false
  laden_surcharge_pct:
    value: 37
    unit: percent of normal dues
    source: Suez Canal Authority surcharge on laden crude tankers from 15 July 2026, as reported by the International Chamber of Shipping
    url: https://www.shippingaustralia.com.au/suez-canal-authority-announces-hike-in-surcharges
    checked: 2026-11-15
    estimate: false
    note: Described by the canal authority as temporary. It was 25% before 15 July 2026.
  ballast_surcharge_pct:
    value: 27
    unit: percent of normal dues
    source: Suez Canal Authority surcharge on ballast crude tankers from 15 July 2026, as reported by the International Chamber of Shipping
    url: https://www.shippingaustralia.com.au/suez-canal-authority-announces-hike-in-surcharges
    checked: 2026-11-15
    estimate: false
  usd_per_sdr:
    value: 1.36
    unit: USD per SDR
    source: Our rounding between two published readings, the IMF SDR valuation ($1.366 on 4 March 2026) and Xe mid-market ($1.354 on 4 November 2026)
    url: https://www.imf.org/external/np/fin/data/rms_sdrv.aspx
    checked: 2026-11-15
    estimate: true
    note: >
      Not a single published reading but a round figure between two, so flagged as an estimate.
      The rate moves a little every day. Using $1.354 instead would change the round-trip Suezmax
      toll by under half a cent a barrel.
  transit_delay_days:
    value: 1.0
    unit: days per transit
    source: Our estimate
    checked: 2026-11-15
    estimate: true
    note: >
      Ships wait at anchor to join a convoy and pass the canal at about 8 knots, so a transit costs
      roughly a day more than sailing the same distance at sea speed.

routing:
  panama_canal_offered:
    value: false
    source: Our modelling choice
    url: https://www.spglobal.com/commodity-insights/en/news-research/latest-news/shipping/092520-neopanamax-locks-increase-draft-permits-fully-laden-suezmaxes
    checked: 2026-11-17
    estimate: true
    note: >
      The model never routes a cargo through the Panama Canal, even though it is the shortest way
      from the US Gulf to China or Korea. A VLCC cannot use it at all. A fully laden Suezmax needs
      about 50 feet of draught, which is at or above the canal's limit (it has moved between 44 and
      50 feet in recent years), so it would have to sail part-loaded. Smaller Aframax and Panamax
      tankers can pass, but we have no free source for the tanker toll, so rather than guess we do
      not offer the route. US crude to Asia is offered via Suez or via the Cape.
  red_sea_on_suez_route:
    value: true
    source: Geography, confirmed by the routing library for every port pair in this file
    checked: 2026-11-17
    estimate: false
    note: >
      Every discharge port reached through the Suez Canal in this model (India, Singapore, China,
      Korea) lies beyond the Red Sea, so a Suez routing always passes the Bab el-Mandeb strait.
      That is why the Red Sea war-risk premium is charged on every Suez transit and never on a
      Cape or direct routing.

reference_distances:
  # Used only by the tests, to check the routing library gives sensible answers.
  houston_mumbai_via_suez_nm:
    value: 9700
    unit: nautical miles
    source: Built up from standard port-distance table legs (Houston-Gibraltar, Gibraltar-Port Said, canal, Suez-Mumbai)
    url: https://sea-distances.org/
    checked: 2026-11-15
    estimate: true
    note: >
      Approximate, summed from legs as we remember them from published tables (about 4,800 + 1,900 +
      90 + 2,950 nm). Good enough for a plus-or-minus 6% sanity check; verify on sea-distances.org
      before quoting it.
  houston_mumbai_via_cape_nm:
    value: 11900
    unit: nautical miles
    source: Built up from standard port-distance table legs (Houston-Cape Town, Cape Town-Mumbai)
    url: https://sea-distances.org/
    checked: 2026-11-15
    estimate: true
    note: Approximate (about 7,300 + 4,600 nm). Same caveat as above.
  houston_rotterdam_nm:
    value: 5000
    unit: nautical miles
    source: Standard port-distance tables give roughly 5,000 nm for Houston to Rotterdam
    url: https://sea-distances.org/
    checked: 2026-11-17
    estimate: true
    note: >
      Approximate, as we remember it from published tables; the routing library gives 5,002 nm.
      Good enough for a plus-or-minus 6% sanity check; verify on sea-distances.org before quoting it.
